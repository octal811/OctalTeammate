<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <title>Task update</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f3f4f6; font-family: 'Segoe UI', Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
    a { text-decoration: none; }
    .wrapper { width: 100%; table-layout: fixed; background-color: #f3f4f6; padding: 32px 0; }
    .main { width: 100%; max-width: 560px; margin: 0 auto; border-collapse: collapse; }
    .card { background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); }
    .header { background: linear-gradient(135deg, #0d9488 0%, #0891b2 100%); padding: 28px 36px; }
    .header-brand { color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .body { padding: 36px; }
    .badge { display: inline-block; background-color: #ccfbf1; color: #0f766e; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 12px; border-radius: 999px; margin-bottom: 16px; }
    .title { margin: 0 0 16px; font-size: 22px; font-weight: 700; color: #111827; line-height: 1.3; }
    .message { margin: 0 0 28px; font-size: 15px; line-height: 1.7; color: #4b5563; }
    .task-card { background-color: #f9fafb; border-left: 4px solid #0d9488; border-radius: 8px; padding: 16px 20px; margin-bottom: 28px; }
    .task-meta { margin: 0; font-size: 13px; color: #6b7280; }
    .btn-wrap { text-align: center; margin-bottom: 28px; }
    .btn { background: linear-gradient(135deg, #0d9488 0%, #0891b2 100%); color: #ffffff !important; font-weight: 700; font-size: 15px; padding: 12px 32px; border-radius: 8px; display: inline-block; }
    .divider { border: 0; border-top: 1px solid #e5e7eb; margin: 8px 0 24px; }
    .footer-note { margin: 0; font-size: 12px; line-height: 1.6; color: #9ca3af; }
    .footer-note a { color: #9ca3af; text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #111827; }
      .card { background-color: #1f2937; }
      .title { color: #f9fafb; }
      .message { color: #d1d5db; }
      .task-card { background-color: #374151; border-left-color: #2dd4bf; }
      .task-meta { color: #9ca3af; }
      .badge { background-color: #134e4a; color: #5eead4; }
    }
  </style>
</head>
<body>
  <table role="presentation" class="wrapper" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" class="main" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <table role="presentation" class="card" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td class="header">
                    <span class="header-brand">{{ AppName }}</span>
                  </td>
                </tr>
                <tr>
                  <td class="body">
                    <span class="badge">Task Notification</span>
                    <h1 class="title">{{ TaskTitle }}</h1>
                    <p class="message">{{ Message }}</p>
                    <div class="task-card">
                      <p class="task-meta">Task reference: <strong>{{ TaskTitle }}</strong></p>
                    </div>
                    {{ #if ActionUrl }}
                    <div class="btn-wrap">
                      <a class="btn" href="{{ ActionUrl }}" id="task-action-btn">View Task</a>
                    </div>
                    {{ /if }}
                    <hr class="divider"/>
                    <p class="footer-note">
                      You are receiving this because you are a member of the {{ AppName }} team.<br/>
                      For support, contact <a href="mailto:{{ SupportEmail }}">{{ SupportEmail }}</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <script>
    // Progressive enhancement — only runs in a browser preview; email clients ignore it.
    (function () {
      try {
        var btn = document.getElementById('task-action-btn');
        if (btn) {
          btn.addEventListener('mousedown', function () { btn.style.opacity = '0.8'; });
          btn.addEventListener('mouseup', function () { btn.style.opacity = '1'; });
        }
      } catch (e) { /* email clients have no DOM at render time */ }
    })();
  </script>
</body>
</html>
