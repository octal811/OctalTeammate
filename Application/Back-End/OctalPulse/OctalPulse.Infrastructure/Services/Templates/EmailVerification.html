<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <title>Verify your email</title>
  <style>
    /* Works in most clients; JS is progressive enhancement for browser preview */
    body { margin: 0; padding: 0; background-color: #f3f4f6; font-family: 'Segoe UI', Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
    a { text-decoration: none; }
    .wrapper { width: 100%; table-layout: fixed; background-color: #f3f4f6; padding: 32px 0; }
    .main { width: 100%; max-width: 560px; margin: 0 auto; border-collapse: collapse; }
    .card { background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); }
    .header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 28px 36px; }
    .header-brand { color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .body { padding: 36px; }
    .title { margin: 0 0 12px; font-size: 24px; font-weight: 700; color: #111827; }
    .message { margin: 0 0 28px; font-size: 15px; line-height: 1.7; color: #4b5563; }
    .otp-box { text-align: center; padding: 20px 16px; background-color: #f9fafb; border: 1px dashed #c7d2fe; border-radius: 12px; margin-bottom: 20px; }
    .otp-code { font-size: 36px; font-weight: 800; letter-spacing: 10px; color: #4f46e5; font-family: 'Courier New', monospace; }
    .otp-timer { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .otp-timer strong { color: #d97706; }
    .divider { border: 0; border-top: 1px solid #e5e7eb; margin: 8px 0 24px; }
    .footer-note { margin: 0; font-size: 12px; line-height: 1.6; color: #9ca3af; }
    .footer-note a { color: #9ca3af; text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #111827; }
      .card { background-color: #1f2937; }
      .title { color: #f9fafb; }
      .message { color: #d1d5db; }
      .otp-box { background-color: #374151; border-color: #4f46e5; }
    }
  </style>
</head>
<body>
  <table role="presentation" class="wrapper" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" class="main" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <table role="presentation" class="card" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td class="header">
                    <span class="header-brand">{{ AppName }}</span>
                  </td>
                </tr>
                <tr>
                  <td class="body">
                    <h1 class="title">{{ Title }}</h1>
                    <p class="message">{{ Message }}</p>
                    <div class="otp-box">
                      <span class="otp-code">{{ OtpCode }}</span>
                    </div>
                    <div class="otp-timer">
                      Code <strong id="otp-timer-text">{{ ExpiryMinutes }} minutes</strong> until it expires
                    </div>
                    <hr class="divider"/>
                    <p class="footer-note">
                      If you didn't request this code, you can safely ignore this email.<br/>
                      For support, contact <a href="mailto:{{ SupportEmail }}">{{ SupportEmail }}</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <script>
    // Live countdown — works when previewed in a browser; safely ignored by email clients.
    (function () {
      try {
        var minutes = parseInt('{{ ExpiryMinutes }}', 10);
        if (!isNaN(minutes) && minutes > 0) {
          var target = Date.now() + minutes * 60 * 1000;
          var el = document.getElementById('otp-timer-text');
          var tick = function () {
            var diff = target - Date.now();
            if (diff <= 0) { el.textContent = 'expired'; return; }
            var m = Math.floor(diff / 60000);
            var s = Math.floor((diff % 60000) / 1000);
            el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
            setTimeout(tick, 1000);
          };
          tick();
        }
      } catch (e) { /* email clients have no DOM at render time */ }
    })();
  </script>
</body>
</html>
